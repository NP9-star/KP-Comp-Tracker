# Local padel market tracker
# Edit this file to change clubs, hours or prices. Times are UK local time.

timezone: Europe/London
horizon_days: 10          # how many days ahead to watch
near_days: 3              # the next 3 days are checked every run...
far_days_every_n_runs: 4  # ...days further ahead every 4th run (every 2 hours), to keep requests low
block_minutes: 30         # occupancy is measured in 30-minute court blocks
max_gap_minutes: 180      # if no check ran within this long before a block starts, the block is excluded
min_day_coverage: 0.8     # days with less than 80% of opening hours watched are left out

# Revenue is annualised as: average daily court revenue x days_open_per_year
days_open_per_year: 355   # 365 less 10 closure days (maintenance, Christmas)

# Peak windows (used to split occupancy into peak / off-peak)
peak:
  weekday: "17:00-22:00"
  weekend: "08:00-20:00"
peak_label: "weekdays 17:00–22:00, weekends 08:00–20:00"

# "Standard hours" view: occupancy measured only within these hours, so clubs that open
# early or late are compared like-for-like
standard_hours: {mon-fri: "07:00-22:00", sat-sun: "08:00-22:00"}
standard_hours_label: "07:00–22:00 weekdays, 08:00–22:00 weekends"

# Rainfall and temperature for the area (Open-Meteo), used to see weather effects on outdoor courts
weather: {lat: 51.60, lon: -0.70, label: "South Buckinghamshire"}
# Groups in a different area get their own rainfall, so wet days line up with their outdoor courts
group_weather:
  tw17: {lat: 51.39, lon: -0.47, label: "Shepperton (TW17) area"}

groups:
  local: "Local clubs"
  tw17: "TW17 benchmarks"
  benchmark: "Wider benchmarks"

