name: Track competitor availability

on:
  schedule:
    - cron: "7,37 * * * *"      # every 30 minutes (GitHub may run a few minutes late)
  workflow_dispatch:
    inputs:
      mode:
        description: "track = normal run, discover = connection check"
        default: track
        type: choice
        options: [track, discover]

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache headless browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Install headless browser (only used if a site refuses normal requests)
        run: python -m playwright install --with-deps chromium

      - name: Discover (connection check)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'discover'
        run: python -m tracker.discover
      - name: Upload raw responses
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'discover'
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: data/debug/

      - name: Collect availability
        if: github.event_name == 'schedule' || inputs.mode == 'track'
        run: python -m tracker.collect
      - name: Build dashboard data
        if: github.event_name == 'schedule' || inputs.mode == 'track'
        run: python -m tracker.analyse
      - name: Save results
        if: github.event_name == 'schedule' || inputs.mode == 'track'
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "Update availability $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet || true
          git push
