name: Track competitor availability

# Runs on your own computer (a "self-hosted runner") because the booking sites
# block GitHub's cloud servers. The computer must be on and the runner running.

on:
  schedule:
    - cron: "7,37 * * * *"      # every 30 minutes (GitHub may start it a few minutes late)
  workflow_dispatch:
    inputs:
      mode:
        description: "track = normal run, discover = connection check"
        default: track
        type: choice
        options: [track, discover]

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

defaults:
  run:
    shell: cmd

env:
  PYTHONUTF8: "1"

jobs:
  run:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Python packages
        run: python -m pip install --quiet --disable-pip-version-check -r requirements.txt
      - name: Install headless browser (first run only, then instant)
        run: python -m playwright install chromium

      - name: Discover (connection check)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'discover'
        run: python -m tracker.discover
      - name: Upload raw responses
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'discover'
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: data/debug/

      - name: Collect availability
        if: github.event_name == 'schedule' || inputs.mode == 'track'
        run: python -m tracker.collect
      - name: Build dashboard data
        if: github.event_name == 'schedule' || inputs.mode == 'track'
        run: python -m tracker.analyse
      - name: Save results
        if: github.event_name == 'schedule' || inputs.mode == 'track'
        run: python -m tracker.save
      - name: Tidy up
        if: always()
        run: python -c "import shutil; shutil.rmtree('data/debug', ignore_errors=True)"
